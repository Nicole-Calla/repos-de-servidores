name: Pipeline iPod Classic
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-run:
    name: Build y despliegue con Docker
    runs-on: self-hosted

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Construir la imagen Docker
        run: docker build -t ipod-classic .

      - name: Eliminar contenedor anterior (si existe)
        run: docker rm -f ipod-classic || true

      - name: Ejecutar el contenedor
        run: docker run -d --name ipod-classic -e CI=true -p 3000:3000 ipod-classic

      - name: Verificar que la app responde
        run: |
          for i in $(seq 1 30); do
            if curl -fsL http://localhost:3000/iPod-Classic/ > /dev/null; then
              echo "La app responde correctamente"
              exit 0
            fi
            echo "Esperando a la app... intento $i"
            sleep 5
          done
          echo "La app no respondio"
          docker logs ipod-classic
          exit 1
